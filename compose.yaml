# Services the integration tests and E2E runs depend on. `pnpm gate:full` brings them up and leaves them running.
# Host ports are deliberately away from the defaults so they do not collide with other projects' containers; each can
# be moved with the variable named in its mapping. The project and the ports come from the worktree's stack slot
# (scripts/stack.ts): the main checkout is slot 0, this file's `nymbal` and defaults; a linked worktree's slot runs
# `docker compose -p nymbal-s<k>` with every port moved, so worktrees share no container. A hand-run `docker compose`
# gets both in a subshell, so the slot is not left pinned in the shell: `(eval "$(pnpm --silent stack env)"; docker compose up -d)`.
name: nymbal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: nymbal
      POSTGRES_DB: nymbal
    ports:
      - '${NYMBAL_POSTGRES_PORT:-54329}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nymbal']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '${NYMBAL_REDIS_PORT:-63799}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.22.0
    # Chaos refuses nothing until a trigger is set; the mail outage journey sets one.
    environment:
      MP_ENABLE_CHAOS: 'true'
    ports:
      - '${NYMBAL_MAILPIT_SMTP_PORT:-11025}:1025'
      - '${NYMBAL_MAILPIT_UI_PORT:-18025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage for `media: { provider: 's3' }`. The community fork of MinIO: minio/minio and minio/mc are
  # no longer published. Its credentials are MinIO's defaults, which the S3 test suites assume.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${NYMBAL_MINIO_PORT:-59000}:9000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: the bucket a local development store uses, `nymbal-media`, with anonymous download. Run it with
  # `docker compose run --rm minio-init`; it is under a profile because `up --wait` fails on a container that exits,
  # even with 0. The tests make buckets of their own.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    profiles: ['init']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/nymbal-media &&
        mc anonymous set download local/nymbal-media

  # The migration kit's journeys: a real WordPress on a Nymbal cart. Under profiles so `up --wait` starts none of it;
  # `wordpress-init` is one-shot and in a profile of its own, as `minio-init`, for the same reason.
  wordpress-db:
    image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    profiles: ['wordpress']
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 3s
      retries: 60

  wordpress:
    image: wordpress:7.1-php8.4-apache@sha256:543d2b75f287c76f387cd17dcf2ca5e69745a1c30b754e32414a5e1ef5b8da87
    profiles: ['wordpress']
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # One install answers on every host the journeys open it on. The CLI has no Host header.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://' . ($$_SERVER['HTTP_HOST'] ?? 'localhost'));
        define('WP_SITEURL', WP_HOME);
    ports:
      - '127.0.0.1:${NYMBAL_WORDPRESS_PORT:-3051}:80'
    volumes: &wordpress-volumes
      - wordpress-site:/var/www/html
      - ./tests/e2e/fixtures/wordpress/theme:/var/www/html/wp-content/themes/nymbal-kit-fixture:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost/readme.html']
      interval: 2s
      timeout: 3s
      retries: 60

  wordpress-init:
    image: wordpress:cli-2.12-php8.4@sha256:37b7e3ed9b537788756f9b5c6dd8ec7c3f3053ee707abc67c776e453ba8f9e55
    profiles: ['wordpress-init']
    depends_on:
      wordpress-db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    # The site's files belong to the Apache image's www-data, whose uid differs from the CLI image's.
    user: '33:33'
    environment: *wordpress-environment
    volumes: *wordpress-volumes
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        wp core is-installed --url=http://localhost ||
        wp core install --url=http://localhost --title=Nymbal --admin_user=admin --admin_password=admin
        --admin_email=admin@nymbal.dev --skip-email;
        wp theme activate nymbal-kit-fixture --url=http://localhost

volumes:
  wordpress-site:

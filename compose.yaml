# Services the integration tests and E2E runs depend on. `pnpm gate:full` runs `docker compose up -d --wait` and
# leaves them running. Host ports are deliberately away from the defaults so they do not collide with other
# projects' containers; each can be moved with the variable named in its mapping.
name: nymbal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: nymbal
      POSTGRES_DB: nymbal
    ports:
      - '${NYMBAL_POSTGRES_PORT:-54329}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nymbal']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '${NYMBAL_REDIS_PORT:-63799}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - '${NYMBAL_MAILPIT_SMTP_PORT:-11025}:1025'
      - '${NYMBAL_MAILPIT_UI_PORT:-18025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

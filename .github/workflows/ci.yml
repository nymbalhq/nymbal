name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  PNPM_VERSION: '9.12.3'
  NODE_VERSION: '22'
  # The base every gate.ts call diffs against: the target branch on a pull request, the previous tip on a push.
  GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  build:
    name: Build all packages, templates and admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:templates
      - run: pnpm --filter @nymbal/admin build
      # The one artefact every other job downloads; nothing downstream builds.
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            templates/astro/dist
            templates/astro/.astro
            templates/nextjs/.next
            !templates/nextjs/.next/cache
            apps/admin/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Gate — lint, typecheck, tests, census trend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Gate
        run: pnpm exec tsx scripts/gate.ts --full --only "lint,typecheck,tests,census trend" --no-build --base "$GATE_BASE"

  integration:
    name: Integration — Postgres, Redis, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Postgres integration
        run: pnpm exec tsx scripts/gate.ts --full --only integration-postgres --no-build --services external --base "$GATE_BASE"
      - name: Platform and importers integration, contracts
        run: pnpm vitest run --project platform-integration --project importers-integration --project contracts-native

  mutation:
    name: Mutation — Stryker (incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - uses: actions/cache@v6
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-
      - name: Mutation
        run: pnpm exec tsx scripts/gate.ts --full --only stryker --no-build --base "$GATE_BASE"

  sentinels:
    name: Sentinels and tests-fail-on-base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Sentinels
        run: pnpm exec tsx scripts/gate.ts --full --only "sentinels,tests-fail-on-base" --no-build --services external --base "$GATE_BASE"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # integration-postgres has its own job, with a database.
      - run: pnpm vitest run --coverage --project '!integration-postgres'

  e2e-astro:
    name: E2E — Astro
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Install Playwright browsers
        run: pnpm --filter @nymbal/e2e exec playwright install --with-deps chromium
      - name: Astro (functional, visual, a11y)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e astro" --no-build --base "$GATE_BASE"

  e2e-nextjs:
    name: E2E — Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Install Playwright browsers
        run: pnpm --filter @nymbal/e2e exec playwright install --with-deps chromium
      - name: Next.js (functional, visual, a11y)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e nextjs" --no-build --base "$GATE_BASE"

  e2e-admin:
    name: E2E — Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Install Playwright browsers
        run: pnpm --filter @nymbal/e2e exec playwright install --with-deps chromium
      - name: Admin (functional, visual, a11y)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e admin" --no-build --base "$GATE_BASE"

  scaffold-smoke:
    name: Scaffold smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Scaffold Astro project
        run: node packages/create-app/bin/create-nymbal-app.mjs smoke-astro --template astro --yes
      - name: Install Astro scaffold deps
        run: pnpm install --no-frozen-lockfile
        working-directory: smoke-astro
      - name: Migrate database (Astro)
        run: pnpm exec nymbal migrate
        working-directory: smoke-astro
      - name: Seed demo content (Astro)
        run: pnpm exec nymbal seed
        working-directory: smoke-astro
      - name: Start the API (Astro)
        run: |
          pnpm exec nymbal dev --api-only &
          echo "ASTRO_API_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-astro
        env:
          NYMBAL_PAYMENTS_PROVIDER: native-stub
      - name: Wait for the API (Astro)
        run: npx wait-on http://localhost:3001/health --timeout 60000
      - name: Start Astro dev server
        run: |
          pnpm dev &
          echo "ASTRO_WEB_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-astro
      - name: Wait for Astro dev server
        run: npx wait-on http://localhost:4321 --timeout 60000
      - name: Verify project override is live (Astro)
        run: curl -fsS http://localhost:4321/ | grep "nymbal:project-override homepage"
      - name: Smoke check Astro
        run: node tools/scaffold-smoke-check.mjs --port 4321
      - name: Stop Astro dev server and API
        run: |
          kill "$ASTRO_WEB_PID"
          kill "$ASTRO_API_PID"
      - name: Scaffold Next.js project
        run: node packages/create-app/bin/create-nymbal-app.mjs smoke-nextjs --template nextjs --yes
      - name: Install Next.js scaffold deps
        run: pnpm install --no-frozen-lockfile
        working-directory: smoke-nextjs
      - name: Migrate database (Next.js)
        run: pnpm exec nymbal migrate
        working-directory: smoke-nextjs
      - name: Seed demo content (Next.js)
        run: pnpm exec nymbal seed
        working-directory: smoke-nextjs
      - name: Start the API (Next.js)
        run: |
          pnpm exec nymbal dev --api-only &
          echo "NEXTJS_API_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-nextjs
        env:
          NYMBAL_PAYMENTS_PROVIDER: native-stub
      - name: Wait for the API (Next.js)
        run: npx wait-on http://localhost:3001/health --timeout 60000
      - name: Start Next.js dev server
        run: |
          pnpm dev &
          echo "NEXTJS_WEB_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-nextjs
      - name: Wait for Next.js dev server
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Smoke check Next.js
        run: node tools/scaffold-smoke-check.mjs --port 3000
      - name: Stop Next.js dev server and API
        run: |
          kill "$NEXTJS_WEB_PID"
          kill "$NEXTJS_API_PID"

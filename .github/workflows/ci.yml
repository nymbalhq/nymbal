        run: pnpm --filter @nymbalhq/e2e exec playwright install-deps chromium
      # The mail outage journey turns this job's Mailpit's Chaos on, so it runs here, after the other target is done.
      - name: Next.js on custom providers (functional, a11y), then a mail outage
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e nextjs-custom,e2e mail-outage" --services external --no-build --base "$GATE_BASE"

  # The no-search fixture store (its search reports no capability), whose header must render no search bar; only the
  # journeys tagged @nosearch run there.
  e2e-astro-nosearch:
    name: E2E — Astro with no search
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]

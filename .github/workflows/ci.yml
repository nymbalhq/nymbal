name: CI

# Tasks merge into dev locally (scripts/merge-to-dev.sh, after a green gate:full at the merged sha), so CI runs on
# the shared branches only: a red dev run is a fix-forward task, and a release needs a green dev run first.
on:
  push:
    branches: [main, dev]

env:
  # The base every gate.ts call diffs against: the previous tip of the pushed branch, so one merge's own changes.
  GATE_BASE: ${{ github.event.before }}

jobs:
  build:
    name: Build all packages, templates and admin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:templates
      - run: pnpm --filter @nymbalhq/admin build
      # The one artefact every other job downloads; nothing downstream builds.
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            templates/astro/dist
            templates/astro/.astro
            templates/nextjs/.next
            !templates/nextjs/.next/cache
            apps/admin/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Gate — lint, typecheck, tests, census trend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Gate
        run: pnpm exec tsx scripts/gate.ts --full --only "lint,typecheck,tests,census trend" --harness all --no-build --base "$GATE_BASE"

  perf-budgets:
    name: Performance budgets — both templates, five pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # The packages come from the build job. The templates are built again by the run: the store's own seed images
      # go into each template's public directory first, and Astro copies them at build time.
      # The suite runs `pnpm perf:budgets` twice: with a 300 KB script added to Astro's home page (it must fail),
      # then as committed (it must pass, and writes the report the pull request quotes).
      - name: perf:budgets (tests/perf)
        run: pnpm exec vitest run --config tests/perf/vitest.config.ts
      # AC-3 and AC-5: each page loads only its own elements, seen only in a production build (the dev-server E2E
      # jobs cannot): both templates built for this slot's API, then the journeys in tests/e2e/prod.
      - name: Install Playwright Chromium
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Production E2E (tests/e2e/prod)
        run: pnpm --filter @nymbalhq/e2e exec playwright test -c playwright.prod.config.ts
      - name: ISR E2E (tests/e2e/isr)
        run: pnpm --filter @nymbalhq/e2e exec playwright test -c playwright.isr.config.ts
      - name: Upload the budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budgets
          path: reports/perf-budgets.json
          if-no-files-found: warn

  integration:
    name: Integration — Postgres, Redis, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
      NYMBAL_TEST_MAILPIT_URL: http://localhost:18025
      NYMBAL_TEST_REDIS_URL: redis://localhost:6379
      NYMBAL_TEST_S3_ENDPOINT: http://localhost:9000
      NYMBAL_TEST_S3_ACCESS_KEY_ID: minioadmin
      NYMBAL_TEST_S3_SECRET_ACCESS_KEY: minioadmin
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - '11025:1025'
          - '18025:8025'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # MinIO for the S3 media suites. A service container cannot pass it `server /data`, so it is started here.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done' \
            || { docker logs minio; exit 1; }
      - name: Postgres integration
        run: pnpm exec tsx scripts/gate.ts --full --only integration-postgres --no-build --services external --base "$GATE_BASE"
      - name: Proof kit services (Postgres race, Mailpit sink)
        run: pnpm exec tsx scripts/gate.ts --full --only proof-kit-services --no-build --services external --base "$GATE_BASE"
      - name: Document stores and event bus on Redis and Postgres JSONB, the kernel on them, the E2E harness, nymbal add redis on a scaffold
        run: pnpm exec tsx scripts/gate.ts --full --only integration-stores --no-build --services external --base "$GATE_BASE"
      - name: Platform and importers integration, contracts
        run: pnpm vitest run --project platform-integration --project importers-integration --project contracts-native

  mutation:
    name: Mutation — Stryker (incremental)
    runs-on: ubuntu-24.04
    # A cold whole-set run (a fresh cache chain, or any platform test change on a miss) measured 1,491 s on this runner
    # (PR #24) and 1,472 s on dev, against 290 s on 12 local cores; the mutate set grows with each service.
    timeout-minutes: 45
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - uses: actions/cache@v6
        with:
          path: reports/mutation/stryker-incremental.json
          # Bumping the prefix starts a fresh chain from a full measurement, dropping statuses carried forward. A
          # ratchet change keeps the chain: the gate measures the files whose entry moved afresh, dropping their
          # cached statuses, and the nightly full run stays the ground truth for the rest.
          key: stryker-incremental-v2-${{ github.sha }}
          restore-keys: stryker-incremental-v2-
      - name: Mutation
        run: pnpm exec tsx scripts/gate.ts --full --only stryker --no-build --base "$GATE_BASE"

  sentinels:
    name: Sentinels and tests-fail-on-base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build]
    # tests-fail-on-base runs every project against the base, so a new Postgres, Mailpit or S3 test needs its server
    # here too, or it fails on base for want of one.
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
      NYMBAL_TEST_MAILPIT_URL: http://localhost:18025
      NYMBAL_TEST_REDIS_URL: redis://localhost:6379
      NYMBAL_TEST_S3_ENDPOINT: http://localhost:9000
      NYMBAL_TEST_S3_ACCESS_KEY_ID: minioadmin
      NYMBAL_TEST_S3_SECRET_ACCESS_KEY: minioadmin
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - '11025:1025'
          - '18025:8025'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # MinIO for the S3 media suites. A service container cannot pass it `server /data`, so it is started here.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done' \
            || { docker logs minio; exit 1; }
      # A push to main or dev, like the nightly and the release, runs every sentinel.
      - name: Sentinels
        run: pnpm exec tsx scripts/gate.ts --full --only "sentinels,tests-fail-on-base" --sentinels all --no-build --services external --base "$GATE_BASE"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    # Not a gate step: four of CI's reds since 2026-10-19 were this job alone (a timeout, a runner), each holding the
    # next merge for a CI run. The job still goes red on a crash; the run does not.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # integration-postgres, integration-stores and proof-kit-services have their own job, with the services they need.
      # Coverage thresholds never block alone (constitution rule 3): a run whose only failure is a threshold miss
      # passes, with the summary on the run page. Vitest exits 1 for a miss and for a failed test alike, so the
      # verdict comes from its JSON test report, whose success ignores thresholds; a crash leaves no report and fails.
      # Instrumented code runs three to four times slower on the runner than in the gate, so every project's own
      # timeouts scale here (vitest.config.ts): a test that only times out under coverage is not a failure.
      - name: Coverage (reported, not a gate)
        env:
          NYMBAL_TEST_TIMEOUT_SCALE: '4'
        run: |
          rm -rf coverage reports/coverage-tests.json
          status=0
          pnpm vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary \
            --reporter=default --reporter=json --outputFile.json=reports/coverage-tests.json \
            --project '!integration-*' --exclude 'packages/proof-kit/tests/services/**' || status=$?
          node -e '
            const fs = require("fs")
            const out = ["## Coverage", ""]
            if (fs.existsSync("coverage/coverage-summary.json")) {
              const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total
              out.push("| metric | covered | total | % |", "|---|---:|---:|---:|")
              for (const k of ["lines", "statements", "functions", "branches"]) {
                out.push(`| ${k} | ${t[k].covered} | ${t[k].total} | ${t[k].pct}% |`)
              }
            } else {
              out.push("No coverage summary: the run did not finish.")
            }
            if (process.argv[1] !== "0") out.push("", `Vitest exited ${process.argv[1]}; thresholds are reported, never blocking.`)
            console.log(out.join("\n"))
          ' "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            node -e '
              const fs = require("fs")
              const f = "reports/coverage-tests.json"
              const ok = fs.existsSync(f) && JSON.parse(fs.readFileSync(f, "utf8")).success === true
              if (!ok) {
                console.error("the coverage run failed: a test failed or the run crashed")
                process.exit(1)
              }
              console.log("every test passed; the coverage threshold miss is reported, not blocking")
            '
          fi

  e2e-astro:
    name: E2E — Astro

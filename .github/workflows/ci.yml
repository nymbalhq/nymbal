      - name: Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Install Playwright system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install-deps chromium
      - name: Next.js with no search (@nosearch)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e nextjs-nosearch" --no-build --base "$GATE_BASE"


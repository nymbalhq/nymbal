      - name: Install Playwright system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install-deps chromium
      - name: Astro with no search (@nosearch)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e astro-nosearch" --no-build --base "$GATE_BASE"

  e2e-nextjs-nosearch:
    name: E2E — Next.js with no search
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7

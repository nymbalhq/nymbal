  e2e-admin:
    name: E2E — Admin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:

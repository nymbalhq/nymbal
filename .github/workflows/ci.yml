name: CI

# Tasks merge into dev locally (scripts/merge-to-dev.sh, after a green gate:full at the merged sha), so CI runs on
# the shared branches only: a red dev run is a fix-forward task, and a release needs a green dev run first. A release
# dispatches a run of every job on dev, Lighthouse included.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      select:
        description: Which jobs run (all, or auto for those the change reaches)
        type: choice
        options: [all, auto]
        default: auto
      base:
        description: The commit every gate.ts call diffs against (a release passes origin/main)
        type: string
        required: true

env:
  # The base every gate.ts call diffs against: on a push the previous tip of the pushed branch, so one merge's own
  # changes; a dispatch carries no `before`, so it names its base.
  GATE_BASE: ${{ github.event.before || inputs.base }}

jobs:
  build:
    name: Build all packages, templates and admin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:templates
      - run: pnpm --filter @nymbalhq/admin build
      # The one artefact every other job downloads; nothing downstream builds.
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/adapters/*/*/dist
            templates/astro/dist
            templates/astro/.astro
            templates/nextjs/.next
            !templates/nextjs/.next/cache
            apps/admin/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The tests step split over shards that run side by side, each file in one shard; the lightest shard runs the
  # static steps too, which adds no job to the org's concurrent-job cap.
  gate-tests:
    name: Gate — tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Gate — lint, typecheck, census trend
        if: matrix.shard == 1
        run: pnpm exec tsx scripts/gate.ts --full --only "lint,typecheck,census trend" --harness all --no-build --base "$GATE_BASE"
      - name: Gate — tests
        # A red static step in shard 1 still leaves that shard's test verdict.
        if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/gate.ts --full --only tests --harness all --no-build --shard ${{ matrix.shard }}/3 --base "$GATE_BASE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: reports/vitest.json
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7

  perf-budgets:
    name: Performance budgets — both templates, five pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # The packages come from the build job. The templates are built again by each perf:budgets run: the store's own
      # seed images go into each template's public directory first, and Astro copies them at build time.
      # Every event holds each page's script bytes to its budget, with no Lighthouse; the nightly runs Lighthouse.
      - name: perf:budgets --bytes
        run: pnpm perf:budgets --bytes
      # A dispatch (the release's) also runs the Lighthouse suite. It runs `pnpm perf:budgets` twice: with a 300 KB
      # script added to Astro's home page (it must fail), then as committed (it must pass, and writes the report).
      # Each metric is the median of five Lighthouse runs a page: of three, one slow run on a shared runner was enough
      # to cross a budget.
      - name: perf:budgets (tests/perf)
        if: github.event_name == 'workflow_dispatch'
        env:
          NYMBAL_PERF_BUDGETS_ARGS: --runs 5
        run: pnpm exec vitest run --config tests/perf/vitest.config.ts
      # Each page loads only its own elements, seen only in a production build (the dev-server E2E jobs cannot): both
      # templates built for this slot's API, then the journeys in tests/e2e/prod.
      # The browsers are cached on the runner OS and the locked Playwright version; the cache holds no system
      # libraries, so a hit still installs those.
      - name: Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Install Playwright system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install-deps chromium
      - name: Production E2E (tests/e2e/prod)
        run: pnpm --filter @nymbalhq/e2e exec playwright test -c playwright.prod.config.ts
      - name: ISR E2E (tests/e2e/isr)
        run: pnpm --filter @nymbalhq/e2e exec playwright test -c playwright.isr.config.ts
      - name: Upload the budget reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budgets
          path: |
            reports/perf-bytes.json
            reports/perf-budgets.json
          if-no-files-found: warn

  integration:
    name: Integration — Postgres, Redis, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
      NYMBAL_TEST_MAILPIT_URL: http://localhost:18025
      NYMBAL_TEST_REDIS_URL: redis://localhost:6379
      NYMBAL_TEST_S3_ENDPOINT: http://localhost:9000
      NYMBAL_TEST_S3_ACCESS_KEY_ID: minioadmin
      NYMBAL_TEST_S3_SECRET_ACCESS_KEY: minioadmin
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.22.0
        env:
          MP_ENABLE_CHAOS: 'true'
        ports:
          - '11025:1025'
          - '18025:8025'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # MinIO for the S3 media suites. A service container cannot pass it `server /data`, so it is started here.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done' \
            || { docker logs minio; exit 1; }
      - name: Postgres integration
        run: pnpm exec tsx scripts/gate.ts --full --only integration-postgres --no-build --services external --base "$GATE_BASE"
      - name: Proof kit services (Postgres race, Mailpit sink)
        run: pnpm exec tsx scripts/gate.ts --full --only proof-kit-services --no-build --services external --base "$GATE_BASE"
      - name: Document stores and event bus on Redis and Postgres JSONB, the kernel on them, the E2E harness, nymbal add redis on a scaffold
        run: pnpm exec tsx scripts/gate.ts --full --only integration-stores --no-build --services external --base "$GATE_BASE"
      - name: Platform and importers integration, contracts
        run: pnpm vitest run --project platform-integration --project importers-integration --project contracts-native

  mutation:
    name: Mutation — Stryker (incremental)
    runs-on: ubuntu-24.04
    # A cold whole-set run (a fresh cache chain, or any platform test change on a miss) measured 1,491 s on this runner
    # (PR #24) and 1,472 s on dev, against 290 s on 12 local cores; the mutate set grows with each service.
    timeout-minutes: 45
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - uses: actions/cache@v6
        with:
          path: reports/mutation/stryker-incremental.json
          # Bumping the prefix starts a fresh chain from a full measurement, dropping statuses carried forward. A
          # ratchet change keeps the chain: the gate measures the files whose entry moved afresh, dropping their
          # cached statuses, and the nightly full run stays the ground truth for the rest.
          key: stryker-incremental-v2-${{ github.sha }}
          restore-keys: stryker-incremental-v2-
      - name: Mutation
        run: pnpm exec tsx scripts/gate.ts --full --only stryker --no-build --base "$GATE_BASE"

  sentinels:
    name: Sentinels and tests-fail-on-base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build]
    # tests-fail-on-base runs every project against the base, so a new Postgres, Mailpit or S3 test needs its server
    # here too, or it fails on base for want of one.
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
      NYMBAL_TEST_MAILPIT_URL: http://localhost:18025
      NYMBAL_TEST_S3_ENDPOINT: http://localhost:9000
      NYMBAL_TEST_S3_ACCESS_KEY_ID: minioadmin

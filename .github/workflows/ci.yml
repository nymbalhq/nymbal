      - name: Astro (functional, visual, a11y)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e astro" --no-build --base "$GATE_BASE"

  e2e-nextjs:
    name: E2E — Next.js
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7

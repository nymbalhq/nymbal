name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  PNPM_VERSION: '9.12.3'
  # The base every gate.ts call diffs against: the target branch on a pull request, the previous tip on a push.
  GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  build:
    name: Build all packages, templates and admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:templates
      - run: pnpm --filter @nymbalhq/admin build
      # The one artefact every other job downloads; nothing downstream builds.
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            templates/astro/dist
            templates/astro/.astro
            templates/nextjs/.next
            !templates/nextjs/.next/cache
            apps/admin/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Gate — lint, typecheck, tests, census trend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Gate
        run: pnpm exec tsx scripts/gate.ts --full --only "lint,typecheck,tests,census trend" --no-build --base "$GATE_BASE"

  integration:
    name: Integration — Postgres, Redis, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
      NYMBAL_TEST_MAILPIT_URL: http://localhost:18025
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - '11025:1025'
          - '18025:8025'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Postgres integration
        run: pnpm exec tsx scripts/gate.ts --full --only integration-postgres --no-build --services external --base "$GATE_BASE"
      - name: Proof kit services (Postgres race, Mailpit sink)
        run: pnpm exec tsx scripts/gate.ts --full --only proof-kit-services --no-build --services external --base "$GATE_BASE"
      - name: Platform and importers integration, contracts
        run: pnpm vitest run --project platform-integration --project importers-integration --project contracts-native

  mutation:
    name: Mutation — Stryker (incremental)
    runs-on: ubuntu-latest
    # A cold whole-set run (a fresh cache chain, or any platform test change on a miss) measured 1,491 s on this runner
    # (PR #24) and 1,472 s on dev, against 290 s on 12 local cores; the mutate set grows with each service.
    timeout-minutes: 45
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - uses: actions/cache@v6
        with:
          path: reports/mutation/stryker-incremental.json
          # Bumping the prefix starts a fresh chain from a full measurement, dropping statuses carried forward. A
          # ratchet change keeps the chain: the gate measures the files whose entry moved afresh, dropping their
          # cached statuses, and the nightly full run stays the ground truth for the rest.
          key: stryker-incremental-v2-${{ github.sha }}
          restore-keys: stryker-incremental-v2-
      - name: Mutation
        run: pnpm exec tsx scripts/gate.ts --full --only stryker --no-build --base "$GATE_BASE"

  sentinels:
    name: Sentinels and tests-fail-on-base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    # tests-fail-on-base runs every project against the base, so a new Postgres or Mailpit test needs its server here
    # too, or it fails on base for want of one.
    env:
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
      NYMBAL_TEST_MAILPIT_URL: http://localhost:18025
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - '11025:1025'
          - '18025:8025'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # A pull request runs the sentinels its change can affect; a push to main or dev, like the nightly and the
      # release, runs every one.
      - name: Sentinels
        run: pnpm exec tsx scripts/gate.ts --full --only "sentinels,tests-fail-on-base" --sentinels ${{ github.event_name == 'pull_request' && 'impacted' || 'all' }} --no-build --services external --base "$GATE_BASE"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # integration-postgres and proof-kit-services have their own job, with the services they need.
      # Coverage thresholds never block alone (constitution rule 3): a run whose only failure is a threshold miss
      # passes, with the summary on the run page. Vitest exits 1 for a miss and for a failed test alike, so the
      # verdict comes from its JSON test report, whose success ignores thresholds; a crash leaves no report and fails.
      - name: Coverage (reported, not a gate)
        run: |
          rm -rf coverage reports/coverage-tests.json
          status=0
          pnpm vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary \
            --reporter=default --reporter=json --outputFile.json=reports/coverage-tests.json \
            --project '!integration-postgres' --exclude 'packages/proof-kit/tests/services/**' || status=$?
          node -e '
            const fs = require("fs")
            const out = ["## Coverage", ""]
            if (fs.existsSync("coverage/coverage-summary.json")) {
              const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total
              out.push("| metric | covered | total | % |", "|---|---:|---:|---:|")
              for (const k of ["lines", "statements", "functions", "branches"]) {
                out.push(`| ${k} | ${t[k].covered} | ${t[k].total} | ${t[k].pct}% |`)
              }
            } else {
              out.push("No coverage summary: the run did not finish.")
            }
            if (process.argv[1] !== "0") out.push("", `Vitest exited ${process.argv[1]}; thresholds are reported, never blocking.`)
            console.log(out.join("\n"))
          ' "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            node -e '
              const fs = require("fs")
              const f = "reports/coverage-tests.json"
              const ok = fs.existsSync(f) && JSON.parse(fs.readFileSync(f, "utf8")).success === true
              if (!ok) {
                console.error("the coverage run failed: a test failed or the run crashed")
                process.exit(1)
              }
              console.log("every test passed; the coverage threshold miss is reported, not blocking")
            '
          fi

  e2e-astro:
    name: E2E — Astro
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Install Playwright browsers
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Astro (functional, visual, a11y)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e astro" --no-build --base "$GATE_BASE"

  e2e-nextjs:
    name: E2E — Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Install Playwright browsers
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Next.js (functional, visual, a11y)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e nextjs" --no-build --base "$GATE_BASE"

  e2e-admin:
    name: E2E — Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Install Playwright browsers
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Admin (functional, visual, a11y)
        run: pnpm exec tsx scripts/gate.ts --full --only "e2e admin" --no-build --base "$GATE_BASE"

  scaffold-smoke:
    name: Scaffold smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Scaffold Astro project
        run: pnpm exec node packages/create-app/bin/create-nymbal-app.mjs smoke-astro --template astro --yes --no-install
      - name: Install Astro scaffold deps
        run: pnpm install --no-frozen-lockfile
        working-directory: smoke-astro
      - name: Migrate database (Astro)
        run: pnpm exec nymbal migrate
        working-directory: smoke-astro
      - name: Seed demo content (Astro)
        run: pnpm exec nymbal seed
        working-directory: smoke-astro
      - name: Start the API (Astro)
        run: |
          pnpm exec nymbal dev --api-only &
          echo "ASTRO_API_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-astro
        env:
          NYMBAL_PAYMENTS_PROVIDER: native-stub
      - name: Wait for the API (Astro)
        run: npx wait-on http://localhost:3001/health --timeout 60000
      - name: Start Astro dev server
        run: |
          pnpm dev --ignore-lock &
          echo "ASTRO_WEB_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-astro
      - name: Wait for Astro dev server
        run: npx wait-on http://localhost:4321 --timeout 60000
      - name: Verify project override is live (Astro)
        run: curl -fsS http://localhost:4321/ | grep "nymbal:project-override homepage"
      - name: Smoke check Astro
        run: node tools/scaffold-smoke-check.mjs --port 4321
      - name: Stop Astro dev server and API
        run: |
          kill "$ASTRO_WEB_PID"
          kill "$ASTRO_API_PID"
      - name: Scaffold Next.js project
        run: pnpm exec node packages/create-app/bin/create-nymbal-app.mjs smoke-nextjs --template nextjs --yes --no-install
      - name: Install Next.js scaffold deps
        run: pnpm install --no-frozen-lockfile
        working-directory: smoke-nextjs
      - name: Migrate database (Next.js)
        run: pnpm exec nymbal migrate
        working-directory: smoke-nextjs
      - name: Seed demo content (Next.js)
        run: pnpm exec nymbal seed
        working-directory: smoke-nextjs
      - name: Start the API (Next.js)
        run: |
          pnpm exec nymbal dev --api-only &
          echo "NEXTJS_API_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-nextjs
        env:
          NYMBAL_PAYMENTS_PROVIDER: native-stub
      - name: Wait for the API (Next.js)
        run: npx wait-on http://localhost:3001/health --timeout 60000
      - name: Start Next.js dev server
        run: |
          pnpm dev &
          echo "NEXTJS_WEB_PID=$!" >> "$GITHUB_ENV"
        working-directory: smoke-nextjs
      - name: Wait for Next.js dev server
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Smoke check Next.js
        run: node tools/scaffold-smoke-check.mjs --port 3000
      - name: Stop Next.js dev server and API
        run: |
          kill "$NEXTJS_WEB_PID"
          kill "$NEXTJS_API_PID"

  scaffold-clean:
    name: Scaffold from a clean machine (${{ matrix.template }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: [astro, nextjs]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The script builds and publishes every public package at a snapshot version to a local Verdaccio (Docker),
      # scaffolds outside the checkout against it, and serves the store; nothing reaches npmjs and no token is used.
      - name: Scaffold, install and serve from a local registry
        shell: bash
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          scripts/scaffold-clean.sh "$TEMPLATE" | tee scaffold-clean.log
          grep '^scaffold-clean: ' scaffold-clean.log | tail -1 >> "$GITHUB_STEP_SUMMARY"

  changeset:
    name: Changeset
    # The main -> dev back-merge carries no changes of its own.
    if: github.event_name == 'pull_request' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A diff whose only package files are tests needs no changeset; any other defers to `changeset status`.
      - run: pnpm exec tsx scripts/changeset-needed.ts --base origin/${{ github.base_ref }}

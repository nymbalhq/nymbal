  # The same journeys on the custom-providers fixture store (search and payments swapped for custom adapters), in
  # jobs of their own so the native ones keep their time.
  e2e-astro-custom:
    name: E2E — Astro on custom providers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    # The custom store's email is SMTP into this Mailpit, which its alert journeys read.
    env:
      NYMBAL_TEST_MAILPIT_URL: http://localhost:18025
      NYMBAL_TEST_MAILPIT_SMTP: localhost:11025
    services:
      mailpit:
        image: axllent/mailpit:v1.22.0
        env:
          MP_ENABLE_CHAOS: 'true'
        ports:
          - '11025:1025'
          - '18025:8025'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:

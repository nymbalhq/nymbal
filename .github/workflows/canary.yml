name: Canary

# A merge to dev with pending changesets publishes a snapshot of the changed packages to the npm `canary` tag
# (`npm exec nymbal@canary`). It never commits, tags or pushes, and never moves `latest`.
# Needs no secret: npm takes the publish through trusted publishing (every published package names this repository
# and canary.yml as a trusted publisher on npmjs.com), and pnpm publish trades the job's OIDC token for a short-lived
# npm token and adds provenance itself. A canary also waits until every public package it would publish already
# exists on npm (scripts/canary-ready.ts), which is true once the first release from main has gone out.

on:
  push:
    branches: [dev]

concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect changesets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.scan.outputs.changesets }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        name: Look for pending changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pending changesets, no canary to publish."
          fi

  canary:
    name: Publish canary
    needs: detect
    if: needs.detect.outputs.changesets == 'true'
    runs-on: ubuntu-latest
    # The OIDC token npm trusts for the publish.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the current versions
        run: pnpm -r list --json --depth -1 > "$RUNNER_TEMP/before.json"
      - name: Version the snapshot
        run: |
          set -euo pipefail
          pnpm changeset version --snapshot canary
          pnpm -r list --json --depth -1 > "$RUNNER_TEMP/after.json"
      # A canary must never be a package's first publish: npm gives a first publish `latest` whatever --tag says.
      - id: ready
        name: Check that the canary publishes only packages already on npm
        run: pnpm exec tsx scripts/canary-ready.ts --before "$RUNNER_TEMP/before.json" --after "$RUNNER_TEMP/after.json"
      - if: steps.ready.outputs.ready == 'true'
        run: pnpm build
      # The root build covers packages/** only; the admin publishes its dist, which `nymbal dev` serves.
      - if: steps.ready.outputs.ready == 'true'
        run: pnpm --filter @nymbalhq/admin build
      - name: Publish to the canary tag
        if: steps.ready.outputs.ready == 'true'
        run: pnpm changeset publish --tag canary --no-git-tag

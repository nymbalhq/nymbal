name: Release

# A merge to main with pending changesets versions the changed packages, publishes them to npm `latest` with
# provenance, tags them and writes GitHub release notes from the changelogs. Needs one repository secret:
#   RELEASE_TOKEN  fine-grained token (or App token) with contents write: the release commit and the tags are made
#                  with it so their checks run
# Without it the dependent jobs are skipped with a notice. npm takes the publish through trusted publishing, with no
# npm secret: every published package names this repository and release.yml as a trusted publisher on npmjs.com, and
# pnpm publish trades the publish job's OIDC token for a short-lived npm token and adds provenance itself. A package
# must exist on npm with its trusted publisher set before a release can publish it. Publishing, tags and releases
# skip what exists, so re-running a run whose publish failed completes the release.

on:
  push:
    branches: [main]

# The release commit re-triggers this workflow; it finds no changesets, so it only publishes what is missing (nothing).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Detect changesets and the release token
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.scan.outputs.changesets }}
      release_token: ${{ steps.tokens.outputs.release_token }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        name: Look for pending changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pending changesets, nothing to release."
          fi
      - id: tokens
        name: Check the release secret
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "release_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN is not set: skipping the release commit, the publish and the tags."
          fi

  version:
    name: Version and commit the release
    needs: detect
    if: needs.detect.outputs.changesets == 'true' && needs.detect.outputs.release_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version packages
        run: pnpm changeset version
      # `@nymbalhq/stack` pins exact versions, so the bump changes the lockfile too; without it the publish job's
      # frozen install refuses the release commit.
      - run: pnpm install --lockfile-only
      # The build rewrites the scaffold templates with the new versions; they ship in the release commit.
      - run: pnpm build
      - name: Commit the release to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages"
          git push origin HEAD:main

  # Runs on every push to main with the release token, whether or not this push carried changesets: publishing, tagging and
  # releasing skip whatever already exists, so re-running a failed run (or the next push) completes the release.
  # Not on the release commit's own push: the run that made it publishes from it, and the registry still reads the
  # new versions as unpublished for a while after, so a second publish fails on every one.
  publish:
    name: Publish, tag and release
    needs: [detect, version]
    # Quoted: the message's ": " would end a plain YAML scalar.
    if: "${{ !cancelled() && !failure() && needs.detect.outputs.release_token == 'true' && !startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    runs-on: ubuntu-latest
    # Only this job can mint the OIDC token npm trusts; the version job runs the build without it.
    permissions:
      contents: write
      id-token: write
    steps:
      # The branch tip, not the pushed sha: it holds the release commit, on a re-run too.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # After versioning: the CLI reads its version from package.json and the scaffold bakes the versions in.
      - run: pnpm build
      # The root build covers packages/** only; the admin publishes its dist, which `nymbal dev` serves.
      - run: pnpm --filter @nymbalhq/admin build
      # changeset publish writes annotated tags, which need an identity; without one each `git tag -m` fails and it
      # carries on, so the 0.2.0 run pushed no tag.
      - name: Set the git identity for tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish to npm
        run: pnpm changeset publish
      # changeset publish tags only what it published in this run; a version an earlier, failed run published is
      # tagged here instead. The registry can answer 404 for a minute after a publish, so a missing version is asked
      # again before it is taken as unpublished.
      - name: Tag released versions that have no tag
        run: |
          set -euo pipefail
          pnpm -r list --json --depth -1 \
            | jq -r '.[] | select(.private != true) | "\(.name)@\(.version)"' \
            | while read -r tag; do
                git rev-parse -q --verify "refs/tags/$tag" > /dev/null && continue
                for attempt in 1 2 3 4 5 6; do
                  if npm view "$tag" version < /dev/null > /dev/null 2>&1; then git tag "$tag"; break; fi
                  if [ "$attempt" -lt 6 ]; then sleep 15; fi
                done
              done
      - name: Push tags
        run: git push origin --tags
      - name: Create GitHub releases from the changelogs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          pnpm -r list --json --depth -1 > "$RUNNER_TEMP/packages.json"
          for tag in $(git tag --points-at HEAD); do
            if gh release view "$tag" > /dev/null 2>&1; then continue; fi
            name="${tag%@*}"
            version="${tag##*@}"
            dir=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .path' "$RUNNER_TEMP/packages.json")
            notes=""
            if [ -n "$dir" ] && [ -f "$dir/CHANGELOG.md" ]; then
              notes=$(awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' "$dir/CHANGELOG.md")
            fi
            [ -n "$notes" ] || notes="Released $tag."
            gh release create "$tag" --verify-tag --title "$tag" --notes "$notes"
          done

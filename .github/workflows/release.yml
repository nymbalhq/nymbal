name: Release

# A merge to main with pending changesets versions the changed packages, publishes them to npm `latest` with
# provenance, tags them, writes GitHub release notes from the changelogs, and opens a main -> dev back-merge pull
# request. A fix merged straight to main gets the same back-merge pull request. Needs two repository secrets:
#   RELEASE_TOKEN  fine-grained token (or App token) with contents and pull-requests write: the release commit, the
#                  tags and the back-merge pull request are made with it so their checks run
#   NPM_TOKEN      npm granular token with publish rights on @nymbalhq/*, nymbal and create-nymbal-app
# Without a secret the dependent steps are skipped with a notice.

on:
  push:
    branches: [main]

# The release commit re-triggers this workflow; it finds no changesets and exits early.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PNPM_VERSION: '9.12.3'
  NODE_VERSION: '22'

jobs:
  detect:
    name: Detect changesets and tokens
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.scan.outputs.changesets }}
      release_token: ${{ steps.tokens.outputs.release_token }}
      npm_token: ${{ steps.tokens.outputs.npm_token }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        name: Look for pending changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pending changesets, nothing to release."
          fi
      - id: tokens
        name: Check release secrets
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "release_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN is not set: skipping the release commit, tags and back-merge pull request."
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "npm_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set: skipping the npm publish."
          fi

  release:
    name: Version, publish and tag
    needs: detect
    if: needs.detect.outputs.changesets == 'true' && needs.detect.outputs.release_token == 'true' && needs.detect.outputs.npm_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version packages
        run: pnpm changeset version
      - name: Commit the release to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages"
          git push origin HEAD:main
      # After versioning: the CLI reads its version from package.json and the scaffold bakes the versions in.
      - run: pnpm build
      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Push tags
        run: git push origin --tags
      - name: Create GitHub releases from the changelogs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          pnpm -r list --json --depth -1 > "$RUNNER_TEMP/packages.json"
          for tag in $(git tag --points-at HEAD); do
            name="${tag%@*}"
            version="${tag##*@}"
            dir=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .path' "$RUNNER_TEMP/packages.json")
            notes=""
            if [ -n "$dir" ] && [ -f "$dir/CHANGELOG.md" ]; then
              notes=$(awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' "$dir/CHANGELOG.md")
            fi
            [ -n "$notes" ] || notes="Released $tag."
            gh release create "$tag" --verify-tag --title "$tag" --notes "$notes"
          done

  back-merge:
    name: Back-merge main into dev
    needs: [detect, release]
    # Runs after every push to main except the release commit itself: the release job's run (the push that carried
    # the changesets) already covers it, and the release commit's own run would only repeat it.
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.detect.outputs.release_token == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open a main -> dev pull request if none is open
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$REPO/compare/dev...main" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "::notice::dev already contains main, no back-merge needed."
            exit 0
          fi
          open=$(gh pr list --repo "$REPO" --base dev --head main --state open --json number --jq length)
          if [ "$open" -gt 0 ]; then
            echo "::notice::A main -> dev pull request is already open."
            exit 0
          fi
          gh pr create --repo "$REPO" --base dev --head main \
            --title "chore: back-merge main into dev" \
            --body "Brings the release commit and any fixes merged to main back into dev. Merge with a merge commit, never squash."

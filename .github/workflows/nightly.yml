name: Nightly
run-name: Nightly on ${{ github.ref_name }}

# Dispatched on dev each night by nightly-trigger.yml: a schedule runs the default branch's copy of a workflow, and
# this one must run dev's own. It runs what a dev push leaves out (Lighthouse, coverage, the mobile E2E, the full
# mutation runs), and a red run here holds the next merge into dev, as a red push run does.
on:
  workflow_dispatch:

jobs:
  perf-budgets:
    name: Performance budgets — both templates, five pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Seeds an API with the store's own images, builds and serves both templates, and holds every page to
      # perf-budgets.json, as the pull request job does, on the median of five runs a page.
      - run: pnpm perf:budgets --runs 5
      - name: Upload the budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budgets
          path: reports/perf-budgets.json
          if-no-files-found: warn

  build:
    name: Build all packages, templates and admin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:templates
      - run: pnpm --filter @nymbalhq/admin build
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/adapters/*/*/dist
            templates/astro/dist
            templates/astro/.astro
            templates/nextjs/.next
            !templates/nextjs/.next/cache
            apps/admin/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  mutation-full:
    name: Mutation — full Stryker run
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Stryker over every mutate target, ignoring the incremental file
        run: pnpm mutation --force
      - name: No file below its unit ratchet entry
        run: pnpm --silent mutation:ratchet check --report reports/mutation/mutation.json
      - name: Upload the Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/mutation
          if-no-files-found: warn

  mutation-integration:
    # The files only the platform integration tests reach, mutated under those tests (SQLite), held by their own ratchet.
    name: Mutation — integration-tested files
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Stryker over the integration-tested files
        run: pnpm mutation:integration
      - name: No file below its integration ratchet entry
        run: pnpm --silent mutation:ratchet check --config stryker.integration.config.mjs --ratchet mutation-ratchet.integration.json --report reports/mutation-integration/mutation.json
      - name: Upload the Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-integration-report
          path: reports/mutation-integration
          if-no-files-found: warn

  quarantine:
    # The tests the gate quarantined (vitest.config.ts, NIGHTLY): red then green with no code change in a gate or CI.
    # Each runs here, apart from every gate, until it is fixed, so its red is logged and never holds a merge.
    name: Quarantined tests
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 30
    continue-on-error: true
    env:
      CI: true
      NYMBAL_NIGHTLY: '1'
      NYMBAL_TEST_S3_ENDPOINT: http://localhost:9000
      NYMBAL_TEST_S3_ACCESS_KEY_ID: minioadmin
      NYMBAL_TEST_S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # MinIO for the S3 import suite, as in ci.yml's integration job.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done' \
            || { docker logs minio; exit 1; }
      - name: The quarantined tests
        run: pnpm exec vitest run --project nightly

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build]
    # Not a gate step: four of CI's reds since 2026-10-19 were this job alone (a timeout, a runner), each holding the
    # next merge for a CI run. The job still goes red on a crash, which the merge logs; the run does not.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      # integration-postgres, integration-stores and proof-kit-services run in gate-full, with the services they need.
      # Coverage thresholds never block alone (constitution rule 3): a run whose only failure is a threshold miss
      # passes, with the summary on the run page. Vitest exits 1 for a miss and for a failed test alike, so the
      # verdict comes from its JSON test report, whose success ignores thresholds; a crash leaves no report and fails.
      # Instrumented code runs three to four times slower on the runner than in the gate, so every project's own
      # timeouts scale here (vitest.config.ts): a test that only times out under coverage is not a failure.
      # tooling-slow runs a nested Vitest on a copy of the work tree, so it covers none of the repo's code and needs
      # the full history this shallow checkout lacks; the gate-tests job runs it.
      - name: Coverage (reported, not a gate)
        env:
          NYMBAL_TEST_TIMEOUT_SCALE: '4'
          NYMBAL_VITEST_SKIP_PROJECTS: tooling-slow
        run: |
          rm -rf coverage reports/coverage-tests.json
          status=0
          pnpm vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary \
            --reporter=default --reporter=json --outputFile.json=reports/coverage-tests.json \
            --project '!integration-*' --exclude 'packages/proof-kit/tests/services/**' || status=$?
          node -e '
            const fs = require("fs")
            const out = ["## Coverage", ""]
            if (fs.existsSync("coverage/coverage-summary.json")) {
              const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total
              out.push("| metric | covered | total | % |", "|---|---:|---:|---:|")
              for (const k of ["lines", "statements", "functions", "branches"]) {
                out.push(`| ${k} | ${t[k].covered} | ${t[k].total} | ${t[k].pct}% |`)
              }
            } else {
              out.push("No coverage summary: the run did not finish.")
            }
            if (process.argv[1] !== "0") out.push("", `Vitest exited ${process.argv[1]}; thresholds are reported, never blocking.`)
            console.log(out.join("\n"))
          ' "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            node -e '
              const fs = require("fs")
              const f = "reports/coverage-tests.json"
              const ok = fs.existsSync(f) && JSON.parse(fs.readFileSync(f, "utf8")).success === true
              if (!ok) {
                console.error("the coverage run failed: a test failed or the run crashed")
                process.exit(1)
              }
              console.log("every test passed; the coverage threshold miss is reported, not blocking")
            '
          fi

  gate-full:
    name: Gate — full, end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Install Playwright system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install-deps chromium
      # The previous nightly's commit is not tracked, so the incremental steps judge the last commit.
      - name: gate:full with Docker Compose services
        run: pnpm gate:full --base HEAD~1 --sentinels all
      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-full-reports
          path: reports
          if-no-files-found: warn

  e2e-full:
    # gate-full already runs the desktop projects; this job adds the mobile ones. A mobile red is a screenshot to
    # look at, not a blocker: it is logged and never holds a merge.
    name: E2E — ${{ matrix.target }}, mobile
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [astro, nextjs, admin]
    env:
      CI: true
      NYMBAL_E2E_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Install Playwright system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install-deps chromium
      - name: Visual, mobile
        run: pnpm --filter @nymbalhq/e2e exec playwright test --project ${{ matrix.target }}-mobile
      - name: Upload the Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.target }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          if-no-files-found: ignore

  e2e-stores:
    # The same journeys, unedited, on the other store sets: every implementation must give the storefront and
    # the admin the same products, orders, carts, accounts and live events.
    name: E2E — ${{ matrix.target }} on ${{ matrix.stores }}
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stores: [postgres-redis, postgres-jsonb]
        target: [astro, nextjs, admin]
    env:
      CI: true
      NYMBAL_TEST_POSTGRES_URL: postgres://postgres:nymbal@localhost:5432/nymbal
      NYMBAL_TEST_REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nymbal
          POSTGRES_DB: nymbal
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d nymbal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - name: Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install --with-deps chromium
      - name: Install Playwright system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @nymbalhq/e2e exec playwright install-deps chromium
      # The gate's E2E step on the set: the repo-root config's store variables, and a database and a key prefix of
      # the run's own (scripts/e2e-server.mjs).
      - name: E2E on the store set
        run: >-
          pnpm exec tsx scripts/gate.ts --full --stores ${{ matrix.stores }} --only "e2e ${{ matrix.target }}"
          --no-build --services external --base HEAD~1
      - name: Upload the Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.target }}-${{ matrix.stores }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          if-no-files-found: ignore

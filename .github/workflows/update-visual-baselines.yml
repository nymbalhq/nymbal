name: Update visual baselines

on:
  workflow_dispatch:

env:
  PNPM_VERSION: '9.12.3'
  NODE_VERSION: '22'

permissions:
  contents: write

jobs:
  update-baselines:
    name: Generate baselines (Linux / Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @nymbal/e2e exec playwright install --with-deps chromium

      - name: Generate baselines — all visual projects
        run: |
          pnpm --filter @nymbal/e2e exec playwright test \
            --project astro --project astro-mobile \
            --project nextjs --project nextjs-mobile \
            --grep "@visual" \
            --update-snapshots
        env:
          CI: true

      - name: Commit and push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/journeys/
          if git diff --staged --quiet; then
            echo "No new baselines to commit."
          else
            git commit -m "chore: update visual regression baselines (linux/chromium)"
            git push origin HEAD:${{ github.ref_name }}
          fi

name: Bug report
description: Something in Nymbal does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. A vulnerability goes to the Security tab instead, privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste errors as text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest set of steps, from a new store if you can (`npx create-nymbal-app`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nymbal version
      description: The output of `npx nymbal --version` in your store.
    validations:
      required: true
  - type: dropdown
    id: template
    attributes:
      label: Template
      options:
        - Astro
        - Next.js
        - Not about a storefront
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: nymbal doctor
      description: The output of `npx nymbal doctor --json` in your store. It changes nothing and prints no secrets.
      render: json

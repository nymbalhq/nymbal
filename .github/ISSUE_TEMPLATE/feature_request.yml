name: Feature request
description: Something Nymbal should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you would like it to work. Commands, config or screens you have in mind are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Workarounds or other tools you use for it.

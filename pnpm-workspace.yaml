packages:
  - "packages/*"
  - "templates/*"
  - "apps/*"
  - "tools/*"
  - "tests/*"
  # Scaffold smoke-test projects (create-nymbal-app output). These are throwaway
  # directories created in the repo root by CI scaffold-smoke and local launch
  # proofs. They must be workspace members so `pnpm install` links the unpublished
  # @nymbal/* packages into them (the scaffold pins ^0.1.0, which only resolves
  # via the workspace). They are git-ignored; this glob never matches committed code.
  - "smoke-astro"
  - "smoke-nextjs"
  - "launch-smoke-astro"

packages:
  - "packages/*"
  - "templates/*"
  - "apps/*"
  - "tools/*"
  - "tests/*"
  # Scaffold smoke-test projects (create-nymbal-app output). These are throwaway
  # directories created in the repo root by CI scaffold-smoke and local launch
  # proofs. They must be workspace members so `pnpm install` links the unpublished
  # @nymbalhq/* packages into them (the scaffold pins ^0.1.0, which only resolves
  # via the workspace). They are git-ignored; this glob never matches committed code.
  - "smoke-astro"
  - "smoke-nextjs"
  - "launch-smoke-astro"

# pnpm 11+ reads settings only from here (.npmrc is auth/registry only, package.json's `pnpm` field is ignored).
engineStrict: true
strictPeerDependencies: false
autoInstallPeers: true
linkWorkspacePackages: deep
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling

allowBuilds:
  better-sqlite3: true
  esbuild: true

packageExtensions:
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
